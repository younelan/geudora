# Crispy mail demo configuration
# Copy this to crispy_demo.conf and fill in your details

# SMTP (sending)
smtp_host = smtp.gmail.com
smtp_port = 587
smtp_user = you@gmail.com
smtp_pass = your-app-password
smtp_security = starttls

# POP3 (receiving)
pop3_host = pop.gmail.com
pop3_port = 995
pop3_user = you@gmail.com
pop3_pass = your-app-password
pop3_security = ssl

# Message defaults
from = you@gmail.com
to = friend@example.com
